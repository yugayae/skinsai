[project]
name = "skinai"
version = "0.1.0"
description = "Research-oriented skin lesion analysis system with Telegram bot and computer vision"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkinAI Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=1.0.3",
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "albumentations>=1.4.4",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.3",
]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
]
bot = [
    "aiogram>=3.6.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
