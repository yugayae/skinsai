profile: dermoscopy
description: "Dermoscopy profile trained on permissive ISIC Archive sub-cohort"
target_modality: "dermoscopy"
image_settings:
  input_size: [3, 224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
classes:
  - id: mel
    name_en: "Melanoma"
    name_ru: "Меланома"
  - id: nv
    name_en: "Melanocytic nevus"
    name_ru: "Меланоцитарный невус"
  - id: bcc
    name_en: "Basal cell carcinoma"
    name_ru: "Базальноклеточная карцинома"
  - id: akiec
    name_en: "Actinic keratosis"
    name_ru: "Актинический кератоз"
  - id: bkl
    name_en: "Benign keratosis"
    name_ru: "Доброкачественный кератоз"
  - id: df
    name_en: "Dermatofibroma"
    name_ru: "Дерматофиброма"
  - id: vasc
    name_en: "Vascular lesion"
    name_ru: "Сосудистое поражение"
thresholds:
  tau_abstain: 0.40
  tau_referral_melanoma: 0.25
quality_filters:
  min_dimension: 128
  blur_laplacian_threshold: 100.0
